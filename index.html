<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FlowAI — Voice Dictation & Clean Writing</title>
    <meta
      name="description"
      content="Voice dictation and intelligent text cleanup workspace powered by Whisper and Llama."
    />
    <meta property="og:title" content="FlowAI — Voice Dictation & Clean Writing" />
    <meta
      property="og:description"
      content="Hold to speak, get clean formatted text in seconds. Supports custom dictionary, voice snippets, and multiple writing styles."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & iOS Safari Metadata -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlowAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans (UI/Display) & JetBrains Mono (Timers/Shortcuts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme class before first paint to prevent theme flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('flowai_settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = parsed && parsed.theme ? parsed.theme : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090D16] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
